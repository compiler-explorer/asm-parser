name: CI

on:
  push:
    branches: [ main ]
    tags: ['*']
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install Conan
        id: conan
        uses: turtlebrowser/get-conan@v1.2
        with:
          version: 2.8.1

      - name: Configure conan
        run: |
          conan profile detect
          sed -i 's/compiler\.cppstd=.*/compiler.cppstd=20/g' ~/.conan2/profiles/default
          conan install --build=fmt/11.0.0 .

      - name: Build
        run: |
          CURDIR=$PWD
          mkdir -p build
          cd build
          cmake "-DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=$CURDIR/conan_provider.cmake" -DCMAKE_C_COMPILER=/usr/bin/gcc-10 -DCMAKE_CXX_COMPILER=/usr/bin/g++-10 -DCMAKE_BUILD_TYPE=Release ..
          cmake --build .

      - name: Unit test
        run: |
          cd build/src/test && ./asm-parser-test

      - name: Smoke test
        run: |
          $GITHUB_WORKSPACE/build/src/asm-parser $GITHUB_WORKSPACE/resources/example_intel.asm > ./example_intel.json

      - name: Test running objdump from asm-parser
        run: |
          printf 'int square(int x) { return x * x; }\nint main(int argc, char **argv) { return square(argc); }\n' > fixture.c
          gcc -g -O1 fixture.c -o fixture
          scripts/test-objdump-exec.sh build/src/asm-parser /usr/bin/objdump fixture

      - uses: actions/upload-artifact@v7
        with:
          path: build/src/asm-parser

      - name: Release
        uses: fnkr/github-action-ghr@v1.3
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GHR_COMPRESS: xz
          GHR_PATH: build/src/
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-2022

    steps:
      # The approval tests compare against resources/*.approved.txt byte for byte
      - name: Keep LF line endings on checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - name: Install Conan
        uses: turtlebrowser/get-conan@v1.2
        with:
          version: 2.8.1

      - name: Configure conan
        run: conan profile detect

      - name: Install Ninja
        run: pip install ninja

      # MSVC can't compile the ctre regexes (C1202), so build with the runner's MinGW-w64 GCC
      - name: Build
        run: |
          C:/mingw64/bin/g++.exe --version
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=C:/mingw64/bin/gcc.exe -DCMAKE_CXX_COMPILER=C:/mingw64/bin/g++.exe
          cmake --build build

      - name: Unit test
        working-directory: build/src/test
        run: ./asm-parser-test.exe

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          exe=build/src/asm-parser.exe
          "$exe" resources/example_intel.asm > example_intel.json
          "$exe" -directives -comment_only -unused_labels resources/example.asm > example.json
          "$exe" -stdin -binary -plt -library_functions < resources/gcc12_bin_fmt_O2_flto.asm > objdump.json
          for f in example_intel.json example.json objdump.json; do
            python -c "import json, sys; d = json.load(open(sys.argv[1])); assert len(d['asm']) > 0, 'no asm lines'; print(sys.argv[1], len(d['asm']), 'lines')" "$f"
          done

      - name: Test running objdump from asm-parser
        shell: bash
        env:
          PYTHON: python
          MSYS_NO_PATHCONV: 1
        run: |
          printf 'int square(int x) { return x * x; }\nint main(int argc, char **argv) { return square(argc); }\n' > fixture.c
          C:/mingw64/bin/gcc.exe -g -O1 fixture.c -o fixture.exe
          scripts/test-objdump-exec.sh build/src/asm-parser.exe C:/mingw64/bin/objdump.exe fixture.exe

      - name: Test running objdump from asm-parser on a large binary
        shell: bash
        env:
          PYTHON: python
          MSYS_NO_PATHCONV: 1
        run: |
          # big enough for asm-parser to stop at its line limit and terminate objdump early
          cp build/src/asm-parser.exe large.exe
          scripts/test-objdump-exec.sh build/src/asm-parser.exe C:/mingw64/bin/objdump.exe large.exe

      # Compiled like Compiler Explorer does on Windows: in a compiler-explorer-compiler* temp directory
      - name: Test Windows source paths with a mingw build
        shell: bash
        env:
          MSYS_NO_PATHCONV: 1
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/compiler-explorer-compilerCI123"
          mkdir -p "$dir/src"
          printf 'int helper(int value);\nint square(int num) {\n    return num * num;\n}\nint main() {\n    return square(helper(7));\n}\n' > "$dir/example.cpp"
          printf 'int helper(int value) {\n    return value + 1;\n}\n' > "$dir/src/helper.cpp"
          (cd "$dir" && C:/mingw64/bin/g++.exe -g -O1 -fno-inline example.cpp src/helper.cpp -o output.s.exe)
          windir=$(cygpath -w "$dir")
          build/src/asm-parser.exe -binary -library_functions -objdump C:/mingw64/bin/objdump.exe -- -d "$windir\\output.s.exe" -l --insn-width=16 -C -M intel > paths.json
          # how objdump prints the source paths, for the log
          C:/mingw64/bin/objdump.exe -d "$windir\\output.s.exe" -l | grep -m2 "example.cpp:" || true
          python - << 'EOF'
          import json
          asm = json.load(open('paths.json'))['asm']
          labels = [line['text'] for line in asm if line['text'].endswith(':') and not line['text'].startswith(' ')]
          sources = {(s['file'], s['mainsource']) for line in asm if (s := line.get('source'))}
          print('functions:', labels)
          print('sources:', sorted(sources, key=str))
          assert 'main:' in labels and 'square(int):' in labels and 'helper(int):' in labels, 'user functions missing'
          assert 'mainCRTStartup:' not in labels, 'runtime not filtered'
          assert (None, 'true') in sources, 'main source not recognised'
          assert ('src/helper.cpp', 'false') in sources, 'helper source not recognised'
          EOF

      # TEMPORARY: keep the output of the mingw source paths test for inspection
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mingw-paths-output
          path: |
            paths.json
            ${{ runner.temp }}/compiler-explorer-compilerCI123/output.s.exe

      - uses: actions/upload-artifact@v7
        with:
          name: asm-parser-windows
          path: build/src/asm-parser.exe
